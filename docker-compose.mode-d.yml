# Mode D overlay: starve the monolith (2 GB) and give microservices 16 GB
# with nginx + two replicas. Not equal-total. Replica count via --scale.

x-mode-d-keepalive: &mode-d-keepalive
  SEMS_HTTP_KEEPALIVE: "false"

services:
  postgres-monolith:
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  monolith:
    cpus: 1.0
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

  nginx:
    image: nginx:1.27-alpine
    profiles: ["microservices"]
    ports:
      - "8000:8000"
    volumes:
      - ./workload/nginx/mode-c.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    cpus: 0.4
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 256M

  postgres-microservices:
    command: ["postgres", "-c", "max_connections=200"]
    cpus: 2.0
    mem_limit: 4096m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M

  gateway:
    ports: !reset []
    expose:
      - "8000"
    environment:
      SEMS_HTTP_KEEPALIVE: "false"
    cpus: 0.8
    mem_limit: 1024m
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1024M

  faculty:
    environment:
      <<: *mode-d-keepalive
    cpus: 0.5
    mem_limit: 832m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 832M

  student:
    environment:
      <<: *mode-d-keepalive
    cpus: 0.5
    mem_limit: 832m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 832M

  grade:
    environment:
      <<: *mode-d-keepalive
    cpus: 0.5
    mem_limit: 832m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 832M

  finance:
    environment:
      <<: *mode-d-keepalive
    cpus: 0.5
    mem_limit: 832m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 832M

  attendance:
    environment:
      <<: *mode-d-keepalive
    cpus: 0.5
    mem_limit: 832m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 832M

  library:
    environment:
      <<: *mode-d-keepalive
    cpus: 0.5
    mem_limit: 832m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 832M
