# Experiment matrix. LLM slots run only when credentials exist.
# Do not put API keys in this file.
extract: true
baselines: true
evaluate: true
seed: 42
llm:
  skip_if_missing_credentials: true
  runs: 3
  temperature: 0.2
  max_retries: 2
  conditions:
    - C0
    - C1
    - C2
    - C3
  models:
    - id: A
      provider: openai
      model: gpt-4o-mini
    - id: B
      provider: ollama
      model: llama3.1  # ollama list: llama3.1:latest 46e0c10c039e ~8B
    - id: C
      provider: gemini
      model: gemini-3.8-flash  # 2.5 unavailable on new API keys; historical 2.5 in 2026-08-27_005
