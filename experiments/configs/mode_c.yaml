# Mode C: nginx load balancer + two replicas of each app service.
# Monolith stays at Mode A 4 CPU / 4 GB. Totals are not equal.
# Per-replica CPU/RAM match Mode A. Extra is the second replica plus nginx.
# Sized to fit Docker Desktop ~8 CPU / ~8 GB on this host. Locust is on the host.
mode: C
integrity: sems-r-reconstruction-measured
note: >
  Operational scale-out, not equal-total. Nginx in front of gateway replicas;
  Docker DNS VIP plus disabled HTTP keepalive so peer calls are not pinned to
  one replica. Same locustfile and small HTTP seed as Mode A. Not production SEMS.
  Not a 10k-concurrent production replay. First Locust config is high (100 users /
  300s), the level where the unscaled gateway collapsed in Mode A.
compared_against: A
seed_scale: small
configs:
  - high
base_url: http://127.0.0.1:8000
monolith_database_url: postgresql+psycopg://sems:sems@127.0.0.1:5432/sems_monolith
architectures:
  - monolith
  - microservices
compose_overlay: docker-compose.mode-c.yml
load_balancer: nginx
replicas:
  postgres-microservices: 1
  nginx: 1
  gateway: 2
  faculty: 2
  student: 2
  grade: 2
  finance: 2
  attendance: 2
  library: 2
extra_vs_mode_a:
  nginx: {cpus: 0.25, memory_mb: 128}
  gateway: {cpus: 0.6, memory_mb: 768}
  faculty: {cpus: 0.4, memory_mb: 384}
  student: {cpus: 0.4, memory_mb: 384}
  grade: {cpus: 0.4, memory_mb: 384}
  finance: {cpus: 0.4, memory_mb: 384}
  attendance: {cpus: 0.4, memory_mb: 384}
  library: {cpus: 0.4, memory_mb: 384}
total_cpus:
  monolith: 4.0
  microservices: 7.25
total_memory_mb:
  monolith: 4096
  microservices: 7296
profiles:
  monolith:
    postgres-monolith: {cpus: 1.0, memory_mb: 1024}
    monolith: {cpus: 3.0, memory_mb: 3072}
  microservices:
    postgres-microservices: {cpus: 1.0, memory_mb: 1024, replicas: 1}
    nginx: {cpus: 0.25, memory_mb: 128, replicas: 1}
    gateway: {cpus: 0.6, memory_mb: 768, replicas: 2}
    faculty: {cpus: 0.4, memory_mb: 384, replicas: 2}
    student: {cpus: 0.4, memory_mb: 384, replicas: 2}
    grade: {cpus: 0.4, memory_mb: 384, replicas: 2}
    finance: {cpus: 0.4, memory_mb: 384, replicas: 2}
    attendance: {cpus: 0.4, memory_mb: 384, replicas: 2}
    library: {cpus: 0.4, memory_mb: 384, replicas: 2}
