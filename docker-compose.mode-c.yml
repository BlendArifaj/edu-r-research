# Mode C overlay: nginx on :8000, two replicas of each app service at Mode A
# per-replica limits. Monolith stays on docker-compose.yml. Not equal-total.
# Replica count is applied by `docker compose up --scale`, not deploy.replicas.

x-mode-c-keepalive: &mode-c-keepalive
  SEMS_HTTP_KEEPALIVE: "false"

services:
  nginx:
    image: nginx:1.27-alpine
    profiles: ["microservices"]
    ports:
      - "8000:8000"
    volumes:
      - ./workload/nginx/mode-c.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    cpus: 0.25
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  postgres-microservices:
    command: ["postgres", "-c", "max_connections=200"]

  gateway:
    ports: !reset []
    expose:
      - "8000"
    environment:
      SEMS_HTTP_KEEPALIVE: "false"

  faculty:
    environment:
      <<: *mode-c-keepalive

  student:
    environment:
      <<: *mode-c-keepalive

  grade:
    environment:
      <<: *mode-c-keepalive

  finance:
    environment:
      <<: *mode-c-keepalive

  attendance:
    environment:
      <<: *mode-c-keepalive

  library:
    environment:
      <<: *mode-c-keepalive
